# The gate, on every push and pull request — the release-gate commands of
# CONTRIBUTING.md (Commands) and DEVELOPMENT.md (The gate), on GitHub's
# runners:
#
#   ./run_tests.sh              the GUT suite, here dealt over four runners
#                               (SHARDS=4 SHARD=n — run_tests.sh's own deal,
#                               so a shard on a runner is a shard on a desk)
#   python3 -m unittest ...     the tool tests, from the project root
#   godot --headless --quit-after 3   the boot smoke, with no ERROR line
#   node tools/test_web_offline.cjs   the offline Web package's service
#                               worker in a real browser (its own job)
#
# The Godot binary is the official 4.7.2 Linux release, pinned by the
# SHA-256 of its zip: byte-identical to the ../tools/godot every local
# gate runs (checked 2026-09-17), cached between runs. Nothing here is
# released or uploaded anywhere but the run's own log artifacts; the
# release itself stays a local build on the owner's word
# (docs/release-builds.md). Card art and the 1997 skin are not in the
# repository and never reach a runner: run_tests.sh builds the card packs
# it needs from cards/data/, and leaves out BY NAME the scripts that pin
# the 1997 look (each marked "Needs the imported 1997 skin"; twenty on
# 2026-10-27) — those run on a desk that has imported it. The log's first
# lines count and name the ones left out, and the gate runs the rest.
#
# THE RUNNER IS PINNED to ubuntu-24.04 (2026-10-13): the image the gate
# has been green on ("Image: ubuntu-24.04" in the log of run 38360118334,
# 0.50.21): the Godot download, the headless suite and the tools job were
# tested there. ubuntu-latest moves to Ubuntu 26 from 2026-10-19; move
# the pin when a run there is green.
# upload-artifact is v7 (Node 24); v5 ran on the deprecated Node 20.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_ZIP_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  SHANDALAR_NO_BANNER: 1

jobs:
  gut:
    name: GUT shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 56
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Godot ${{ env.GODOT_VERSION }} from the cache
        id: godot
        uses: actions/cache@v5
        with:
          path: godot.zip
          key: godot-${{ env.GODOT_VERSION }}-stable-linux-x86_64

      - name: Godot ${{ env.GODOT_VERSION }} from the official release
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

      - name: Pin and unpack
        run: |
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mkdir -p ../tools
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ../tools/godot
          chmod +x ../tools/godot
          ../tools/godot --version

      # The step has its own clock, shorter than the job's: when the job's
      # minutes cancel a job, GitHub skips every later step, `if:
      # always()` included, and the engine log is lost with it (shard 2 of
      # run 36869119748, 2026-10-01: cancelled at 45 min, no log, no
      # artifact, nothing to read). A step that times out instead FAILS,
      # and the upload below still runs. run_tests.sh's own guards (import
      # 10 min, suite SUITE_TIMEOUT) add up to under this clock, so a
      # healthy shard never reaches it; a stalled runner does. The suite
      # guard is 40 minutes here, not run_tests.sh's 30 (owner, 2026-10-07):
      # shard 1 of run 37629189768 took 29m42s with the 0.50.16 gate.
      - name: Shard ${{ matrix.shard }} of 4
        timeout-minutes: 52
        env:
          SHARDS: 4
          SHARD: ${{ matrix.shard }}
          SUITE_TIMEOUT: 2400
          SHANDALAR_TEST_DATA_HOME: ${{ runner.temp }}/shandalar-test-data
        run: ./run_tests.sh

      - name: Keep the engine log and the JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gut-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shandalar-test-data/gut-engine.log
            ${{ runner.temp }}/shandalar-test-data/gut-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  tools-and-boot:
    name: Python tools and the boot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Python tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Godot ${{ env.GODOT_VERSION }} from the cache
        id: godot
        uses: actions/cache@v5
        with:
          path: godot.zip
          key: godot-${{ env.GODOT_VERSION }}-stable-linux-x86_64

      - name: Godot ${{ env.GODOT_VERSION }} from the official release
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

      - name: Pin and unpack
        run: |
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mkdir -p ../tools
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ../tools/godot
          chmod +x ../tools/godot

      # The import once, then the boot: user:// is the runner's temp
      # directory, the way every local probe isolates the player's file.
      - name: Boot smoke
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
        run: |
          timeout -k 5 600 ../tools/godot --headless --import . >/dev/null 2>&1 </dev/null || true
          status=0
          timeout -k 5 100 ../tools/godot --headless --path . --quit-after 3 > boot.log 2>&1 </dev/null || status=$?
          cat boot.log
          if [ "$status" -ne 0 ]; then echo "boot exited $status"; exit "$status"; fi
          if grep -qE '^(SCRIPT ERROR|ERROR|USER ERROR|USER SCRIPT ERROR):' boot.log; then
            echo "the boot printed an error"; exit 1
          fi

  # THE OFFLINE WEB PACKAGE'S SERVICE WORKER (review of 2026-10-21): its
  # update, repair and interrupted-install rules (tools/web_offline/) are
  # tested only by tools/test_web_offline.cjs, which loads the worker in a
  # browser through Playwright — and until then ran nowhere, so a change
  # that let a failed update replace a working cache passed every job.
  # A job of its own, beside the others: no Godot, no shard waits on it.
  # Node and Playwright are pinned; the browser is the Chromium that this
  # Playwright installs (`--channel chromium`), where a desk uses Chrome.
  web-offline:
    name: Offline Web service worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_VERSION: 24.21.0
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v5

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Outside the checkout: no package.json, no lock file and no
      # node_modules in the tree; the test finds it through NODE_PATH.
      - name: Playwright ${{ env.PLAYWRIGHT_VERSION }} and its Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock \
            --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Service-worker regressions
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
        run: node tools/test_web_offline.cjs --channel chromium
