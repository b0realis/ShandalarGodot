; Append to export_presets.cfg with an unused preset number (9 in the example).
; Phone/tablet APK, NOT the Quest target. No Gradle, store or XR integration.
; Android 10+ is the initial support target, not a claim about every device.
; Non-Gradle exports retain the official template's minimum/target SDK levels.
[preset.9]
name="Android Experimental"
platform="Android"
runnable=false
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.deck, *.txt, cards/data/*.json, packaging/card_packs/*/*.json"
exclude_filter="tests/*, tools/*, docs/*, addons/*, assets/*, sim_results/*, *.md, DeckLab/results/*, workspace/*, branding/*"
export_path="../shandalar-build/android-arm64-experimental/Shandalar.apk"
script_export_mode=2

[preset.9.options]
custom_template/debug="../tools/export_templates/4.7.2.stable/android_debug.apk"
custom_template/release="../tools/export_templates/4.7.2.stable/android_release.apk"
gradle_build/use_gradle_build=false
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=50046
version/name=""
package/unique_name="com.b0realis.shandalar.android"
package/name="Shandalar (Experimental)"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/edge_to_edge=false
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
permissions/custom_permissions=PackedStringArray()
permissions/access_network_state=true
permissions/access_wifi_state=true
permissions/change_wifi_multicast_state=true
permissions/internet=true
keystore/release=""
keystore/release_user=""
keystore/release_password=""
